services:
  - type: web
    name: anemia-risk-prediction-system
    env: python
    buildCommand: pip install -r requirements.txt && python train_model.py && python init_db.py
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      # To link a PostgreSQL database on Render:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: anemia-db
      #     property: connectionString

databases:
  - name: anemia-db
    plan: free
    databaseName: anemia_db
    user: anemia_user
